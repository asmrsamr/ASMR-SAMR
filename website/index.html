<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Accessibility & Theme Metadata -->
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#2C2825">
  
  <!-- Primary SEO Metadata -->
  <title>ASMR & SAMR | Luxury Artisan Fragrance House Riyadh</title>
  <meta name="description" content="Handcrafted in Riyadh, Saudi Arabia, ASMR & SAMR is an intimate his-and-hers perfume house. We produce true Extrait de Parfum (28% concentration), body sprays, and body creams in small numbered batches. Discover SAMR for her and ASMR for him.">
  <meta name="keywords" content="niche perfume Saudi Arabia, extrait de parfum, عطر, luxury Arabian perfume, his and hers fragrance, oud-adjacent amber, Riyadh small batch perfume, ASMR, SAMR">
  <meta name="author" content="ASMR & SAMR Fragrances">
  <link rel="canonical" href="https://asmrsamr.com/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ASMR & SAMR | Luxury Artisan Fragrance House Riyadh">
  <meta property="og:description" content="Handcrafted in Riyadh, Saudi Arabia, ASMR & SAMR is an intimate his-and-hers perfume house. We produce true Extrait de Parfum (28% concentration), body sprays, and body creams in small numbered batches. Discover SAMR for her and ASMR for him.">
  <meta property="og:image" content="https://asmrsamr.com/assets/hero/landing-duo-photo.png">
  <meta property="og:url" content="https://asmrsamr.com/">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="ASMR & SAMR | Luxury Artisan Fragrance House Riyadh">
  <meta property="twitter:description" content="Handcrafted in Riyadh, Saudi Arabia, ASMR & SAMR is an intimate his-and-hers perfume house. We produce true Extrait de Parfum (28% concentration), body sprays, and body creams in small numbered batches. Discover SAMR for her and ASMR for him.">
  
  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css?v=dev">
  
  <!-- Structured Schema Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "PerfumeStore",
      "name": "ASMR & SAMR Fragrances",
      "description": "Artisan luxury his-&-hers perfume house crafting 28% concentration Extrait de Parfum in small numbered batches in Riyadh, Saudi Arabia.",
      "url": "https://asmrsamr.com",
      "telephone": "+966560505651",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Riyadh",
        "addressCountry": "SA"
      },
      "priceRange": "$$$",
      "currenciesAccepted": "SAR",
      "founder": {
        "@type": "Organization",
        "name": "ASMR & SAMR Fragrances"
      }
    }
  </script>
</head>
<body>

  <!-- Accessible Skip Link -->
  <a href="#main-root" class="skip-link" id="skip-to-content-btn">Skip to main content</a>

  <!-- Sticky Header Nav Root -->
  <header id="header-root"></header>

  <!-- Dynamic Page Content Root -->
  <main id="main-root" tabindex="-1"></main>

  <!-- Persistent Dynamic Footer -->
  <footer id="footer-root"></footer>

  <!-- Slide-out Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-hidden="true" inert>
    <div class="cart-header">
      <h3 class="cart-title" id="cart-title-label">Your Order Drawer</h3>
      <button class="cart-close-btn" id="cart-close-btn" aria-label="Close cart">&times;</button>
    </div>
    <div class="cart-items-container" id="cart-items-container" aria-live="polite">
      <!-- Injected dynamically by app.js -->
    </div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span id="cart-label-subtotal">Subtotal</span>
        <span id="cart-subtotal">0 SAR</span>
      </div>
      <div class="cart-total-row" style="font-size: 0.9rem; color: var(--taupe); border-bottom: 1px solid rgba(196,165,102,0.1); padding-bottom: 1rem;">
        <span id="cart-label-vat">VAT (+15%)</span>
        <span id="cart-vat">0 SAR</span>
      </div>
      <div class="cart-total-row" style="font-weight: 500; font-size: 1.25rem; margin-top: 1rem;">
        <span id="cart-label-total">Total Estimate</span>
        <span id="cart-total" class="text-gold">0 SAR</span>
      </div>
      <small class="cart-vat-note" id="cart-vat-label">Prices exclude 15% VAT. Order finalized on WhatsApp.</small>
      <button class="btn btn-primary btn-block" id="cart-checkout-btn" style="margin-top: 1.5rem;">
        Submit Checkout
      </button>
    </div>
  </div>

  <!-- Screen Reader Announcements for Accessibility -->
  <div id="a11y-announcer" class="sr-only" aria-live="polite"></div>

  <!-- Cart Backdrop Overlay -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <!-- Optional browser-safe local config, then application engine. -->
  <script>
    (function loadConfigThenApp() {
      function loadApp() {
        var script = document.createElement('script');
        script.src = 'app.js?v=dev';
        script.charset = 'utf-8';
        document.body.appendChild(script);
      }

      function loadAdminThenApp() {
        var admin = document.createElement('script');
        admin.src = 'admin-dashboard.js?v=dev';
        admin.charset = 'utf-8';
        admin.onload = loadApp;
        admin.onerror = loadApp;
        document.body.appendChild(admin);
      }

      var config = document.createElement('script');
      config.src = 'config.local.js?v=dev';
      config.charset = 'utf-8';
      config.onload = loadAdminThenApp;
      config.onerror = loadAdminThenApp;
      document.head.appendChild(config);
    })();
  </script>
</body>
</html>
